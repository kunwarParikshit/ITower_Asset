apply plugin: 'com.android.application'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'


android {
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.0"
    }


    defaultConfig {
        applicationId 'net.openid.appauthdemo'
        project.archivesBaseName = 'appauth-demoapp'
        vectorDrawables.useSupportLibrary = true

        // Make sure this is consistent with the redirect URI used in res/raw/auth_config.json,
        // or specify additional redirect URIs in AndroidManifest.xml
        manifestPlaceholders = [
                'appAuthRedirectScheme': 'msauth'
        ]
    }

    signingConfigs {
        config {
            keyAlias 'info'
            keyPassword 'infozech'
            storeFile file('/Users/kunwarraghav/Desktop/AndroidProjects/InfozechProjects/Assets\\ Movement/iTower/Keystore/iTower_256.jks')
            storePassword 'infozech'

        }
        release {
            enableV3Signing true
            enableV4Signing true
        }
        debug
                {
                    enableV3Signing true
                    enableV4Signing true
                }
    }

    lintOptions {
        checkReleaseBuilds false
    }


    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }

    //12137_NW_NI0162  02-jan-2019
    compileSdkVersion 34
    //buildToolsVersion '29.0.2'
    defaultConfig {
        //where build app client wise then check 1.SHA256 key 2. color theme 3. launcher icon 4. App Name
        //tawal_icon.png for tawal and logo.png for other/
        //applicationId "infozech.safari"
        applicationId "tawal.com.sa"
        //applicationId "infozech.tawal"
        // applicationId "infozech.demo"
        // applicationId "apollo.com.sa"
        //applicationId "infozech.zamil"
        //applicationId "ock.com.sa"
        //applicationId "eft.com.sa"
        minSdkVersion 29
        targetSdkVersion 34
        //applicationId "infozech.zamil" //replace by "voltalia.com.sa"
        //applicationId "in.clairvoyant.imaintain.activity"
        versionCode 170  // 35   _@-
        versionName "3.70"     //Bangladesh,Kenya 1.0 and Manymar 1.34
        useLibrary 'org.apache.http.legacy'
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        generatedDensities = []
    }

    buildTypes {
        debug {
            minifyEnabled false //true
            debuggable true
            shrinkResources false  //true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false //true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            shrinkResources false  //true

        }
    }

    sourceSets {
        main {
            res.srcDirs = ['src/griditem/res', 'src/griditem/res/xml', 'src/main/res', 'src/main/res', 'src/main/res/layout-large', 'src/main/res/layout-sw600dp', 'src/main/res/font']
            assets.srcDirs = ['src/main/assets', 'src/main/assets/fonts']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation "com.google.accompanist:accompanist-pager:0.32.0"
    implementation "com.google.accompanist:accompanist-pager-indicators:0.32.0"
    // Core Compose libraries
    implementation 'androidx.compose.material3:material3:1.1.0'
    implementation 'androidx.compose.ui:ui:1.4.0' // Core UI dependency for Compose
    implementation 'androidx.compose.material:material:1.4.0' // Material Design components
    implementation 'androidx.compose.ui:ui-tooling-preview:1.4.0' // For UI previews
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1' // Lifecycles support
    implementation 'androidx.activity:activity-compose:1.7.0'
    // For Compose integration with activities
    implementation 'androidx.navigation:navigation-compose:2.6.0'
    // If using Navigation with Compose
    implementation 'androidx.compose.foundation:foundation:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation 'com.google.android.material:material:1.12.0'


    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"

