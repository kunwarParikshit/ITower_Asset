    implementation files('libs/httpclient-4.5.3.jar')
    //compile group: 'org.apache.httpcomponents' , name: 'httpclient-android' , version: '4.3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:3.5.0'
    implementation files('libs/opencsv-4.6.jar')
    implementation 'com.squareup.okhttp3:okhttp:3.2.0'
    implementation 'com.github.scribejava:scribejava-apis:3.2.0'
    implementation('oauth.signpost:signpost-commonshttp4:1.2.1.2') {
        exclude module: 'commons-logging'
        exclude module: 'httpcore'
        exclude module: 'httpclient'
